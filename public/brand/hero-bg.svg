<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#f4ecdc"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6c878" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6c878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e4d2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6e4d2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- soft light blooms -->
  <ellipse cx="330" cy="240" rx="620" ry="520" fill="url(#glowGold)"/>
  <ellipse cx="1650" cy="900" rx="700" ry="560" fill="url(#glowRose)"/>
  <ellipse cx="1500" cy="180" rx="360" ry="300" fill="url(#glowGold)" opacity="0.5"/>

  <!-- faint concentric gold rings -->
  <g stroke="#c8a24c" fill="none" opacity="0.16">
    <circle cx="960" cy="560" r="240"/>
    <circle cx="960" cy="560" r="380"/>
    <circle cx="960" cy="560" r="540"/>
    <circle cx="960" cy="560" r="720"/>
  </g>

  <!-- thin hairlines -->
  <g stroke="#b8912f" opacity="0.12">
    <line x1="0" y1="140" x2="1920" y2="140"/>
    <line x1="0" y1="940" x2="1920" y2="940"/>
  </g>
</svg>
